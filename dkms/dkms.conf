PACKAGE_NAME="snd-usb-audio-waveline"
PACKAGE_VERSION="1.0"

# The sources are not in this package: dkms-stage.sh fetches the target
# kernel's sound/usb and patches it into src/ before every build. That is what
# lets a kernel update rebuild this safely -- see dkms-stage.sh.
PRE_BUILD="dkms-stage.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
CLEAN="rm -rf src"

BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/sound/usb"

# snd-usbmidi-lib is built alongside but deliberately not installed: leaving
# the in-tree copy in place keeps the blast radius to one module. The kernel
# has CONFIG_MODVERSIONS=n, so our snd-usb-audio resolves against it by plain
# symbol name.

# Rebuilt for every new kernel. Needs network access at that point, for the
# kernel.org tarball; without it, or when a patch no longer applies, the build
# fails, nothing is installed for that kernel and the stock driver is used.
# `sudo ./install.sh --kernel-only` retries by hand.
AUTOINSTALL="yes"
REMAKE_INITRD="no"
