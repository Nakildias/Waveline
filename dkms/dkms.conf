PACKAGE_NAME="snd-usb-audio-waveline"
PACKAGE_VERSION="1.0"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="snd-usb-audio"
DEST_MODULE_LOCATION[0]="/kernel/sound/usb"

# snd-usbmidi-lib is built alongside but deliberately not installed: leaving
# the in-tree copy in place keeps the blast radius to one module. The kernel
# has CONFIG_MODVERSIONS=n, so our snd-usb-audio resolves against it by plain
# symbol name.

# Deliberately off. This packages a snapshot of one kernel's sound/usb tree,
# patched for whichever device profiles matched at install time; rebuilding it
# against a newer kernel's headers is not safe. After a kernel upgrade re-run
# install.sh -- it re-stages the sources, re-applies the same set of profile
# patches and rebuilds. Until then the stock in-tree driver is used, which is
# the correct failure mode.
AUTOINSTALL="no"
REMAKE_INITRD="no"
