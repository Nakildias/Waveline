# Elgato Wave:3 (0fd9:0070) -- keep the microphone alive.
#
# The device's ADC only produces audio if its capture isochronous stream was
# started while the playback stream was NOT running, and is never restarted
# afterwards. Verified on raw ALSA with PipeWire stopped, identical on the
# stock in-tree driver, and NOT fixed by QUIRK_FLAG_IFACE_SKIP_CLOSE (the
# altsetting is not the trigger -- stopping/restarting the URB stream is).
#
#   capture running, playback starts later  -> mic keeps working indefinitely
#   playback already streaming, capture (re)started -> digital silence
#
# node.always-process keeps the capture node processing from startup so it is
# never the second stream. session.suspend-timeout-seconds alone is NOT
# sufficient: it only prevents suspension after activation, it never brings
# the node up.
#
# node.lock-quantum keeps the graph quantum from auto-renegotiating while the
# mic is active. Unrelated peers joining/leaving (OBS stopping an SC0710
# HDMI capture monitor is the known case) otherwise resize the quantum and
# rubber-band Wave:3 capture until the ALSA node is reopened. Forced quantum
# changes via metadata still work.
#
# Do not add rules for the *output* node here. Touching the sink's properties
# perturbs which node PipeWire opens first and the microphone loses its head
# start. This is also why 50-waveline-driver-policy.conf lowers inputs instead
# of raising outputs -- a generic alsa_output rule would be exactly the rule
# this paragraph forbids.
#
# ---------------------------------------------------------------- buffering
#
# api.alsa.period-size is pinned; api.alsa.headroom is deliberately left unset.
#
# Capture delay is headroom + period, and an unset headroom lands exactly equal
# to the period size -- so this device is already at the cheapest it can be,
# and writing "api.alsa.headroom = 512" here would make it worse rather than
# confirm it. PipeWire adds a period to a *requested* headroom on USB devices,
# so asking for the value it already has would double it. The Rocksmith
# profile is what that mistake looks like: it asks for 512, runs at 1024, and
# is 11 ms slower than this microphone as a result.
#
# The period is pinned rather than inherited because WirePlumber picks one per
# device and the four devices on the test machine landed on four different
# values with nothing choosing any of them. Worse, the value is not even stable
# within one boot: the C922 next door was observed running at period 256 and,
# after nothing more than a graph reconfiguration, at 512. An inherited period
# is not a setting, it is a coincidence. 512 was what this one ran before any
# of this was pinned; see the CORRECTION below for what it negotiates to now.
#
# Observed capture delay, median of ~1000 samples of `delay` from
# /proc/asound/card<N>/pcm0c/sub0/status: 21.9 ms in one graph state, 11.6 ms
# in another, with these same settings and the device never replugged. Do not
# read either number as a property of this profile. Capture delay tracks the
# effective headroom closely and the rest of it moves with graph state, so the
# only trustworthy figure is the live one -- which is why the mixer measures it
# from this same file rather than computing it from settings. See the
# diagnostics view.
#
# The graph quantum is charged on top of this and is NOT set here or anywhere
# under devices/. It is one machine-wide setting -- the mixer's Latency control
# and 50-waveline-clock.conf. A microphone profile that moves a graph-wide knob
# is a setting whose effect depends on what else is plugged in.
#
# CORRECTION, measured after installing this: api.alsa.period-size is honoured,
# but not literally. Every pinned device on the test machine landed on exactly
# HALF the value written here -- 512 asked, 256 negotiated, confirmed in
# /proc/asound/card<N>/pcm0c/sub0/hw_params. Do not "fix" that by doubling the
# number until the sweep says what the relationship actually is.
#
# What the pin does buy, and the reason it stays, is determinism: pinned
# devices held their period across graph quantum changes of 256, 512 and 1024,
# while an unpinned device tracked the quantum and moved with every one of
# them. So the period is now a decision whose absolute value is not yet
# understood, rather than a coincidence that changes under you. Resolve the
# value with scripts/latency-sweep.sh, which records requested against
# effective for exactly this reason.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_3.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
        node.always-process             = true
        node.lock-quantum               = true
        api.alsa.period-size            = 512  # headroom deliberately unset
      }
    }
  }
]
