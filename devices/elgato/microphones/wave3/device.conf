# Waveline device profile -- Elgato Wave:3.
#
# Sourced by install.sh, and a resolved copy is written to
# ~/.config/waveline/profile.conf for the daemon to read. See devices/README.md
# for the format and for how to add a microphone of your own.

PROFILE_ID="wave3"
PROFILE_LABEL="Elgato Wave:3"

# Brand used for published PipeWire node descriptions (e.g. "Wave:3 Stream Mix").
BRAND="Wave:3"

# Matched against `lsusb` to decide whether this profile applies. The first ID
# is the device proper; the second is its DFU/bootloader identity, matched only
# so a mid-recovery device is still recognised.
USB_IDS="0fd9:0070 0fd9:0071"
PCI_IDS=""

# The ALSA node this device's microphone shows up as. Used by the WirePlumber
# rule below and to find the card during verification.
ALSA_NODE_MATCH="alsa_input.usb-Elgato_Systems_Elgato_Wave_3"

# 1 when the device has controls that ALSA does not expose and Waveline reaches
# over a vendor USB protocol -- Clipguard, direct monitor, the headphone jack on
# the microphone. The mixer hides its whole hardware panel, and the hardware
# monitor mode, when this is 0.
HARDWARE_CONTROLS="1"

# Vendor USB identity the daemon's device layer uses. Only meaningful with
# HARDWARE_CONTROLS=1.
HARDWARE_VENDOR_ID="0x0FD9"
HARDWARE_PRODUCT_ID="0x0070"

# Paths below are relative to this profile's own directory.

# Applied to a staged copy of sound/usb/ by scripts/prepare-src.sh, then built
# and installed through DKMS. Empty for devices that need no kernel change.
KERNEL_PATCH="kernel/apply.py"

# Dropped into ~/.config/wireplumber/wireplumber.conf.d/ and
# ~/.config/pipewire/pipewire.conf.d/ respectively.
#
# PIPEWIRE_CONF is empty, and no device profile should ever set it again. It
# used to carry 51-waveline-wave3-quantum.conf, which pinned the graph quantum
# to 4096 for the Pro Audio card profile -- a graph-wide setting shipped inside
# one microphone's profile, where it applied to every device on the machine and
# could disagree with anything else that wrote clock policy.
#
# Graph clock policy now has exactly one owner: data/pipewire/50-waveline-clock.conf,
# installed on every machine, with the quantum reachable live from the mixer's
# Latency control. The Pro Audio case is the "Pro Audio (85 ms)" setting there;
# it needs no file and no reinstall, and it can be turned off again.
WIREPLUMBER_CONF="wireplumber/51-waveline-wave3.conf"
PIPEWIRE_CONF=""

# Installed to /etc/udev/rules.d/ so the vendor interface is reachable without
# root.
UDEV_RULES="udev/60-waveline-wave3.rules"

# The Wave:3 reports neither its dial nor its mute pad to the kernel, so a
# polling service is offered (installed, not enabled) to keep ALSA in step.
SYNC_SERVICE="1"
