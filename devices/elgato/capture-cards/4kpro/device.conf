# Waveline device profile -- Elgato 4K Pro (Yuan sc0710).
#
# PCIe HDMI capture card. Audio is the ALSA node from the sc0710 driver
# (PCI 12ab:0380, subsystem 1cfa:0012). Master strips auto-name as "4K Pro".

PROFILE_ID="4kpro"
PROFILE_LABEL="Elgato 4K Pro"

BRAND="4K Pro"

USB_IDS=""
# Device ID from sc0710 pci_device_id / sc0710_boards[].
PCI_IDS="12ab:0380"

# PipeWire names PCI nodes by BDF (alsa_input.pci-NNNN_BB_DD.F.*), so matching
# is done at runtime via sysfs product ID rather than a fixed ALSA_NODE_MATCH.
ALSA_NODE_MATCH=""

HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF=""
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
