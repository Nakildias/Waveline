# Waveline device profile -- Elgato 4K60 Pro MK.2 (Yuan sc0710).
#
# PCIe HDMI capture card. Audio is the ALSA node from the sc0710 driver
# (PCI 12ab:0710, subsystem 1cfa:000e). Master strips auto-name as "4K60 MK.2".

PROFILE_ID="4k60mk2"
PROFILE_LABEL="Elgato 4K60 Pro MK.2"

BRAND="4K60 MK.2"

USB_IDS=""
# Device ID from sc0710 pci_device_id / sc0710_boards[].
PCI_IDS="12ab:0710"

# PipeWire names PCI nodes by BDF (alsa_input.pci-NNNN_BB_DD.F.*), so matching
# is done at runtime via sysfs product ID rather than a fixed ALSA_NODE_MATCH.
ALSA_NODE_MATCH=""

HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF=""
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
