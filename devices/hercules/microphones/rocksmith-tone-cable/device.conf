# Waveline device profile -- Hercules Rocksmith Tone Cable (USB guitar adapter).
#
# Mono instrument input (USB audio class, full speed). Capture-only; no vendor
# protocol. WirePlumber keep-alive so PipeWire cannot suspend and reopen the
# capture stream, plus a pinned ALSA period and headroom.
#
# It used to say "low node latency for responsive monitoring". It did not have
# one: node.latency is a quantum request, quantum is negotiated per driver
# group rather than per node, and node.lock-quantum in the same rule masked it
# anyway. Graph latency is a machine-wide setting now -- the Latency control in
# the mixer.

PROFILE_ID="rocksmith-tone-cable"
PROFILE_LABEL="Hercules Rocksmith Tone Cable"

BRAND="Tone Cable"

USB_IDS="12ba:00ff"
PCI_IDS=""

ALSA_NODE_MATCH="alsa_input.usb-Hercules_Rocksmith_USB_Guitar_Adapter"

HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF="wireplumber/51-waveline-rocksmith-tone-cable.conf"
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
