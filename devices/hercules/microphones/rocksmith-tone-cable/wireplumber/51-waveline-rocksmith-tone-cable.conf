# Hercules Rocksmith Tone Cable -- full-speed USB instrument input.
#
# The three keep-alive props are not latency settings. PipeWire suspending and
# reopening this node produces audibly robotic capture on reconnect, so it is
# kept hot and its quantum kept still while a consumer is attached.
#
# node.latency was removed here. It asked for "128/48000" and it did nothing:
# node.latency is a *quantum request*, quantum is negotiated per driver group
# rather than per node, and node.lock-quantum on the line above pins this node
# to the graph's quantum anyway -- so the request was masked by its own
# neighbour. Measured, the graph stayed at 1024 with the request in place, and
# this device's capture delay did not move. Graph
# quantum is now one deliberate machine-wide setting (the mixer's Latency
# control), not something a microphone profile asks for and does not get.
#
# ---------------------------------------------------------------- buffering
#
# api.alsa.headroom was REMOVED, and this is the whole story of why.
#
# It asked for 512 and ran at 768 (PipeWire adds a period to a requested
# headroom on USB devices). That made this the slowest input on the machine by
# a wide margin, and it was the only device on it with an explicit headroom at
# all -- everything else leaves it unset, lands equal to its period, and sits
# in single figures. Measured back to back at a 256-frame graph quantum,
# changing nothing but deleting one line from this file:
#
#   headroom 512 (effective 768)   delay 17.3 ms
#   headroom unset (effective 256) delay  7.9 ms
#
# For comparison on the same graph, with no headroom set: Wave:3 7.5 ms,
# C922 6.6 ms, Meet 4K 4.8 ms. So the setting cost roughly 10 ms and bought a
# guitar input nothing that any other device needed.
#
# It was never a measurement in the first place. It predated any timing work,
# was added for reliability alone, and was tested only for dropouts across
# twenty plug cycles -- and twenty plug cycles is weak evidence about a
# start-up race, which is what the fault it guarded against actually is: with
# too little buffered capture data at the instant the follower resampler
# starts, the stream comes up wrong and stays wrong until it is reopened. Same
# cable, same session, sometimes clean and sometimes glitched from the first
# note.
#
# So the risk of this change is not "it sounds slightly worse". It is that a
# fault which only appears some of the time comes back. If capture from this
# adapter ever starts up robotic or pitch-shifted and stays that way until you
# rebuild the input, put the line back:
#
#     api.alsa.headroom = 512
#
# and say so, because that is evidence the twenty plug cycles could not
# provide. Confirm either way with a soak rather than by plugging it in a few
# times:
#
#   scripts/latency-sweep.sh --device rocksmith --headroom unset,256,512 \
#                            --period 256,512 --soak 20m
#
#   period-size 512  -- pinned rather than inherited. WirePlumber picks this
#                       per device and it is not stable: the C922 was observed
#                       at 256 and then at 512 on the same boot, after nothing
#                       but a graph reconfiguration. See the CORRECTION below
#                       for what it negotiates to.
#
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Hercules_Rocksmith_USB_Guitar_Adapter.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
        node.always-process             = true
        node.lock-quantum               = true
        api.alsa.period-size            = 512
      }
    }
  }
]
