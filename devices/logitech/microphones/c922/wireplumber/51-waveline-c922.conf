# Logitech C922 -- keep capture clock/quantum stable across hotplug.
#
# C922's ALSA hop is prone to adaptive-resampler "robotic" audio when the
# node suspends/resumes or the graph quantum moves while a consumer is
# attached. Match Wave:3's keep-alive props on the *input* only so PipeWire
# does not close and renegotiate the capture stream between our quiet wait
# and the heal rebuild.
#
# ---------------------------------------------------------------- buffering
#
# api.alsa.period-size is pinned; api.alsa.headroom is deliberately left unset,
# because an unset headroom lands exactly equal to the period and that is the
# cheapest this device can be. Writing the same number into headroom would not
# confirm it -- PipeWire adds a period to a *requested* headroom on USB
# devices, so it would double it. See the Rocksmith profile for what that
# costs.
#
# 256 is written down so it is a decision rather than WirePlumber's per-device
# guess; see the CORRECTION below for what it negotiates to. This device is the reason that sentence
# is not merely tidiness: it was observed running at period 256 and then, after
# nothing but a graph reconfiguration on the same boot with no replug and no
# config change, at 512. An inherited period is not a setting, it is whatever
# the last renegotiation happened to land on -- and this is the device that can
# least obviously afford the small one, with 4K video sharing the cable.
#
# Observed capture delay, median of ~1000 samples of `delay` from
# /proc/asound/card<N>/pcm0c/sub0/status: 18.5 ms at period 256, 17.5 ms at
# period 512 -- note that it went *down* when the period doubled, which is the
# opposite of what headroom + period predicts. Capture delay tracks effective
# headroom closely; the remainder moves with graph state and is not something
# this file controls. Treat both numbers as observations rather than as
# properties of this profile, and read the live figure from the mixer's
# diagnostics view, which measures this same file.
#
# Note this camera runs its ADC at 32 kHz, not 48. The graph is pinned to
# 48 kHz (50-waveline-clock.conf) so its capture is resampled on the way in --
# which is correct, and is exactly why it must not be the graph's clock. It
# was, on the test machine, until 50-waveline-driver-policy.conf existed: it
# outranked every other device and clocked a guitar adapter, a studio
# microphone and an HDMI capture card off a 32 kHz webcam.
#
# MEASURED 2026-09-03, and the reason this asks 512 rather than 256.
#
# capture-startup-diag.sh, 28 trials, three capture devices labelled on every
# wavelined restart:
#
#   Wave:3      headroom 256   0/28 robotic
#   Tone Cable  headroom 256   0/28 robotic
#   C922        headroom 128   6/28 robotic
#
# One variable separates them. With period-size asked at 256 this device
# negotiated 128 (the halving below), and an unset headroom lands equal to the
# period -- so the C922 was the only capture device on the machine running at
# half everyone else's buffer, and the only one that ever came up robotic. The
# resync count is not the discriminator: robotic trials logged 1-2 resyncs and
# clean ones logged as many as 5.
#
# Asking 512 puts it at 256/256, level with the two devices that never failed.
# Headroom stays unset for the reason given above -- writing 256 into it would
# land at 512 on a USB device, not confirm the 256 it already has.
#
# CORRECTION, measured after installing this: api.alsa.period-size is honoured,
# but not literally. Every pinned device on the test machine landed on exactly
# HALF the value written here -- 512 asked, 256 negotiated, confirmed in
# /proc/asound/card<N>/pcm0c/sub0/hw_params. Do not "fix" that by doubling the
# number until the sweep says what the relationship actually is.
#
# What the pin does buy, and the reason it stays, is determinism: pinned
# devices held their period across graph quantum changes of 256, 512 and 1024,
# while an unpinned device tracked the quantum and moved with every one of
# them. So the period is now a decision whose absolute value is not yet
# understood, rather than a coincidence that changes under you. Resolve the
# value with scripts/latency-sweep.sh, which records requested against
# effective for exactly this reason.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-046d_C922_Pro_Stream_Webcam.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
        node.always-process             = true
        node.lock-quantum               = true
        api.alsa.period-size            = 512  # headroom deliberately unset
      }
    }
  }
]
