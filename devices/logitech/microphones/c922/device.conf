# Waveline device profile -- Logitech C922 Pro Stream Webcam.
#
# Capture-only USB webcam mic. No kernel quirks or vendor protocol; this profile
# exists so install detection lists it and master strips auto-name as "C922".

PROFILE_ID="c922"
PROFILE_LABEL="Logitech C922"

BRAND="C922"

USB_IDS="046d:085c"
PCI_IDS=""

ALSA_NODE_MATCH="alsa_input.usb-046d_C922_Pro_Stream_Webcam"

HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF="wireplumber/51-waveline-c922.conf"
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
