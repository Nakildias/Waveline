# Waveline device profile -- any ordinary microphone.
#
# The fallback. Selected when no profile in devices/ matches something actually
# plugged in, and it is what makes Waveline a general-purpose mixer rather than
# a Wave:3 utility: the channels, the dual stream/monitor mixes, the noise
# suppression and the application routing are all device-independent.
#
# Nothing here is installed to the system. No kernel patch, no udev rule, no
# WirePlumber or PipeWire drop-in -- an ordinary USB or analogue microphone
# needs none of them, and installing a device's workarounds on a machine that
# does not have that device is how you break the machines that were fine.

PROFILE_ID="generic"
PROFILE_LABEL="Generic microphone"

BRAND="Waveline"

# Never matched: this profile is chosen by elimination, not by detection.
USB_IDS=""
PCI_IDS=""

# Left empty on purpose. With no match the daemon takes whatever PipeWire
# reports as the default source, which is the right answer for a microphone we
# know nothing about.
ALSA_NODE_MATCH=""

# No vendor protocol, so no Clipguard, no direct monitor and no headphone jack
# on the microphone. The mixer drops its hardware panel entirely rather than
# showing controls that cannot do anything.
HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF=""
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
