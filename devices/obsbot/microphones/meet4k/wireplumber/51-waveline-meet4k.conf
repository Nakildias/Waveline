# OBSBOT Meet 4K -- high-speed composite device, audio down the same cable as
# 4K video.
#
# The three keep-alive props are the load-bearing part of this file. A webcam's
# ALSA hop is prone to adaptive-resampler "robotic" audio when the node
# suspends and reopens, or when the graph quantum moves while a consumer is
# attached -- see the C922 profile, same class of device, same failure. The
# node is kept hot rather than allowed to suspend and renegotiate underneath
# us.
#
# ------------------------------------------------- what this file used to say
#
# It set node.latency = "256/48000" and claimed "5.3 ms, a 4x cut". That
# never happened. Measured, this device sat at 21.2 ms -- level with the
# Wave:3, which set no latency at all and was the device this profile was
# written to beat.
#
# node.latency is a quantum request, and quantum is negotiated per driver group
# rather than per node, so a per-device latency request is structurally
# incapable of being per-device: whoever asks smallest drags the whole group,
# and a device that asks for nothing rides on someone else's request. On top of
# that, node.lock-quantum on the line below pinned this node to the graph
# quantum regardless. The setting was documentation of an intent the system
# ignored, and it is gone.
#
# The reasoning that produced it was not wrong about the symptom -- this
# microphone really did lag its own webcam's video. It was wrong about the
# layer. See NOT FIXED HERE below.
#
# ---------------------------------------------------------------- buffering
#
# What moves capture delay is api.alsa.headroom, with a smaller and less
# predictable contribution from api.alsa.period-size and the graph state.
#
#   period-size 512  -- pinned rather than inherited, so this device's budget
#                       is a decision rather than whatever WirePlumber picked
#                       for it. 512 was what it ran before pinning; see the
#                       CORRECTION below for what it negotiates to. Inherited
#                       periods are not stable: the C922 was observed at 256
#                       and then 512 on the same boot, after nothing but a
#                       graph reconfiguration.
#
#   headroom         -- deliberately unset. An unset headroom lands exactly
#                       equal to the period size, which is the cheapest this
#                       device can be. Do not "fix" this by writing 512 here:
#                       PipeWire adds a period to a *requested* headroom on USB
#                       devices, so asking for the value it already has would
#                       double it and cost 10.7 ms for nothing. That is not
#                       hypothetical -- it is what happened to the Rocksmith.
#
# Observed: 21.2 ms, median of 40 samples of `delay` from
# /proc/asound/card<N>/pcm0c/sub0/status -- level with the Wave:3, which is the
# finding that matters here and the one this profile was written on a wrong
# theory about. Treat it as an observation of one graph state rather than a
# property of this profile: the same devices with the same settings were later
# seen 10 ms faster after nothing but a graph reconfiguration. The live figure
# is in the mixer's diagnostics view.
#
# Take period-size down to 256 if you want half of it back, and expect this
# device to be less tolerant of it than an audio-only microphone would be --
# there is 4K video sharing the schedule. Crackling is what an xrun sounds like
# here. Confirm with a soak rather than a plug test:
#
#   scripts/latency-sweep.sh --device meet4k --period 256,512 --soak 20m
#
# -------------------------------------------------- waveline.hidden-latency
#
# This device does its own audio processing, so its latency cannot be measured
# from this machine and Waveline does not pretend otherwise: the mixer shows
# "N/A" for this input instead of a number.
#
# Not a Waveline property in any official sense -- it is an ordinary custom
# node prop, and WirePlumber will carry anything you put here. The daemon reads
# it off the node alongside api.alsa.pcm.card. It lives in this file, rather
# than in device.conf, for a mechanical reason: the daemon loads exactly one
# device profile (the installed one), so a key in device.conf is invisible to
# it for every input that is not the primary microphone. A node property
# arrives attached to the device it describes, whichever of your six inputs
# that is.
#
# Set it when a device is known to process audio before handing it over -- a
# conference camera, a headset with onboard AEC or noise suppression, anything
# whose microphone "sounds good" out of the box. The test for whether it
# belongs here is not "is this device slow", it is "is the delay decided
# somewhere this machine cannot see".
#
# Why N/A and not a measured offset. scripts/latency-offset-test.sh can measure
# this device against a direct microphone, and the first instinct was to record
# that figure here and add it to the displayed number. That would have been the
# same mistake this whole profile was built on: a number that looks precise and
# is not. The offset is a *difference* against whichever reference you happened
# to use, on one firmware, in one processing mode, and a camera that adapts its
# noise suppression to the room does not have a single constant to record. A
# number bent until it matches the ear is worse than no number, because the
# next person believes it. Run the offset test to find out what your device is
# doing; do not carve the answer into a config file.
#
# ---------------------------------------------------------- NOT FIXED HERE
#
# This microphone is reported to *sound* 150-200 ms late, which is an order of
# magnitude more than the 21 ms it measures, on a chain identical to the
# Wave:3's. Nothing in this file can account for that gap, and no buffering
# setting will close it. The suspicion is the camera's own onboard audio
# processing, which is invisible to the host by construction: the host is
# handed a finished stream and is never told how long the camera spent making
# it.
#
# Settle it before spending any more effort on this layer:
#
#   scripts/latency-offset-test.sh --a hw:MEET4K --b hw:WAVE3
#
# records both straight from ALSA with PipeWire out of the path, cross-
# correlates a clap, and reads off the offset. Near zero means the delay is in
# our graph and worth chasing. Near 150 ms means it is inside the camera, in
# which case the honest response is to say so in the mixer and stop tuning --
# no number this project can display will ever include it.
#
# CORRECTION, measured after installing this: api.alsa.period-size is honoured,
# but not literally. Every pinned device on the test machine landed on exactly
# HALF the value written here -- 512 asked, 256 negotiated, confirmed in
# /proc/asound/card<N>/pcm0c/sub0/hw_params. Do not "fix" that by doubling the
# number until the sweep says what the relationship actually is.
#
# What the pin does buy, and the reason it stays, is determinism: pinned
# devices held their period across graph quantum changes of 256, 512 and 1024,
# while an unpinned device tracked the quantum and moved with every one of
# them. So the period is now a decision whose absolute value is not yet
# understood, rather than a coincidence that changes under you. Resolve the
# value with scripts/latency-sweep.sh, which records requested against
# effective for exactly this reason.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Remo_Tech_Co.__Ltd._OBSBOT_Meet_4K.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle              = false
        node.always-process             = true
        node.lock-quantum               = true
        api.alsa.period-size            = 512  # headroom deliberately unset
        waveline.hidden-latency         = true
      }
    }
  }
]
