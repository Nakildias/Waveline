# Waveline device profile -- OBSBOT Meet 4K.
#
# USB conference cam mic. No kernel quirks and no vendor protocol -- its one
# hardware control is an ordinary ALSA mixer element. The profile exists so
# install detection lists it, so master strips auto-name as "Meet 4K", and so
# the udev rule below lifts its preamp off the quiet value it powers on at.

PROFILE_ID="meet4k"
PROFILE_LABEL="OBSBOT Meet 4K"

BRAND="Meet 4K"

USB_IDS="3564:fef3"
PCI_IDS=""

ALSA_NODE_MATCH="alsa_input.usb-Remo_Tech_Co.__Ltd._OBSBOT_Meet_4K"

# 0 in the sense this key means: no vendor protocol, nothing that needs
# waveline-hw. The preamp below is a plain ALSA control, not one of those.
HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF="wireplumber/51-waveline-meet4k.conf"
PIPEWIRE_CONF=""
# Sets the capture preamp on plug. The device powers on at 27 dB of an
# available 54 dB and PipeWire cannot reach the element to raise it; see the
# rule for the whole story.
UDEV_RULES="udev/95-waveline-meet4k.rules"
SYNC_SERVICE="0"
