# Waveline device profile -- Antlion ModMic Wireless.
#
# USB wireless mic receiver (lsusb: Antlion Wireless Microphone). No kernel
# quirks or vendor protocol; this profile exists so install detection lists it
# and master strips auto-name as "ModMic".
#
# The id is modmicwireless, not modmic: Antlion sells wired ModMics too, and
# this profile's USB id and ALSA node match only the wireless receiver. BRAND
# stays "ModMic" because that is what belongs on a mixer strip -- the precision
# is for the files, not for the person looking at the UI.

PROFILE_ID="modmicwireless"
PROFILE_LABEL="Antlion ModMic Wireless"

BRAND="ModMic"

USB_IDS="2f96:0100"
PCI_IDS=""

ALSA_NODE_MATCH="alsa_input.usb-Antlion_Audio_Antlion_Wireless_Microphone"

HARDWARE_CONTROLS="0"

KERNEL_PATCH=""
WIREPLUMBER_CONF="wireplumber/51-waveline-modmicwireless.conf"
PIPEWIRE_CONF=""
UDEV_RULES=""
SYNC_SERVICE="0"
