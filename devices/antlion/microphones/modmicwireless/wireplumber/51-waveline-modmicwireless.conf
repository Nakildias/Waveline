# Antlion ModMic Wireless -- keep graph quantum stable while capture is active.
#
# This node follows another device's graph clock. Headroom is buffered capture
# data available at the moment the follower resampler starts; with too little,
# the stream comes up wrong and stays wrong for as long as it is open.
#
# ---------------------------------------------------------------- buffering
#
# UNMEASURED. This is the one capture profile with no latency figure next to
# its settings, because the device was not attached to the machine the other
# profiles' numbers were measured on. Nothing here should be read as tuned.
#
# api.alsa.headroom = 1024 is the same shape of setting as the Rocksmith's,
# with the same provenance: added for reliability, tested for dropouts across
# twenty plug cycles, never timed. If it behaves like the other USB devices
# then the request is treated as a batch device's and a period is added to it,
# so the effective headroom is larger than the 1024 written here and the cost
# is larger still. On a device whose period is 512 that would be roughly 32 ms
# of capture delay, matching the Rocksmith -- but that is arithmetic from a
# hypothesis, not a measurement, and it is not written into the settings.
#
# api.alsa.period-size is deliberately NOT pinned here for the same reason.
# Pinning a period this project has never observed on this device would be a
# guess dressed up as a decision, which is the habit the whole latency rework
# was about breaking. It inherits WirePlumber's choice until someone runs:
#
#   scripts/latency-sweep.sh --device modmic --headroom 0,512,1024 \
#                            --period 256,512 --soak 20m
#
# and writes the measured floor and its xrun count back into this file. Until
# then the value that was tested for reliability stays, and it stays honest
# about being untimed.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Antlion_Audio_Antlion_Wireless_Microphone.*" }
    ]
    actions = {
      update-props = {
        node.lock-quantum = true
        api.alsa.headroom = 1024  # reliability-tested, latency UNMEASURED
      }
    }
  }
]
