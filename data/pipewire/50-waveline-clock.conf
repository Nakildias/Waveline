# Waveline -- the graph clock. Installed on every machine, always.
#
# This file is the ONLY place Waveline writes graph-wide clock policy. Nothing
# under devices/ may set clock.rate, clock.quantum or their min/max ever again:
# a per-device profile that moves a graph-wide knob is a setting whose effect
# depends on what else is plugged in, which is precisely the "seems kinda
# broken and random" this file exists to end.
#
# ---------------------------------------------------------------- the rate
#
# Pinned, not negotiated. Left to itself PipeWire adopts a rate from whichever
# device wins the driver role, so a 32 kHz webcam becomes the clock for a
# guitar adapter and every input resamples onto a number nobody chose. 48 kHz
# is the rate every consumer device on this list runs natively and the rate
# Waveline's own filters are built at.
#
# allowed-rates is deliberately a single entry. With a list, PipeWire will
# switch the whole graph to match a stream that asks for another rate -- fine
# in isolation, a re-clock of every input mid-stream in a mixer.
#
# ------------------------------------------------------------- the quantum
#
# The quantum is the graph cycle: how much audio moves per scheduling tick. It
# is charged to every path in the graph, on top of whatever the ALSA device
# itself buffers, so it is half of what "latency" means in practice.
#
# 512 frames at 48 kHz is 10.7 ms. That is the shipped default, chosen over
# PipeWire's 1024 (21.3 ms) because Waveline is a live mixer -- you are
# listening to yourself through it -- and over 256 (5.3 ms) because a machine
# that is also encoding a stream has less schedule to spare than a machine
# doing nothing.
#
# Do not read 512 as a hardware limit, and be suspicious of any floor you think
# you have found by ear. On the development machine anything below 256 was
# reported as "glitched out", and that turned out not to be a scheduling limit
# at all: it was the capture resampler being left in a resync loop by the
# quantum *transition* (see the mixer's Latency control, and the rebuild it now
# runs afterwards). With the transition handled, the same machine runs 128
# frames -- 2.7 ms -- cleanly. A latency floor discovered while the transition
# was still breaking things was measuring the bug, not the hardware.
#
# This is a *default*, not a pin. The mixer's Latency control writes
# clock.force-quantum through the settings metadata, which overrides this
# value live, with no restart and no device reopen -- that is why the control
# can exist at all. Nothing here has to change for a user to pick a different
# budget, and this value is what the graph falls back to when wavelined is not
# running.
#
# min/max bracket what negotiation may reach before wavelined pins it:
#
#   min 128   -- below this is a real-time-scheduling problem, not a latency
#                setting, and nothing in Waveline benefits from it.
#   max 8192  -- PipeWire's own clock.quantum-limit. Set to the ceiling on
#                purpose: clock.force-quantum is clamped into this range, and a
#                lower max would silently cap the mixer's Pro Audio setting
#                (4096) at whatever the max happened to be. A user who picks
#                85 ms must get 85 ms, not a number this file quietly imposed.
#
# The range is wide because the daemon pins a single value on top of it. It is
# the pin, not the range, that stops the renegotiation glitch: a graph free to
# move between two quanta resizes ALSA buffers whenever a short-lived
# notification sound joins and leaves, and every follower resampler re-converges
# audibly -- a pitch dip followed by a pitch rise on everything else playing.
# See the Latency control in the mixer, and NOTES below.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 8192
}

# NOTES
#
# Superseded 51-waveline-wave3-quantum.conf, which pinned quantum to 4096 for
# the Wave:3 Pro Audio card profile by setting min == max == 4096. That worked,
# but it was a second file writing graph-wide clock policy from inside a device
# profile, and the two could disagree: install one and the other's numbers were
# silently unreachable. The Pro Audio case is now the mixer's "Pro Audio
# (85 ms)" latency setting, which reaches the same 4096 through force-quantum
# and can be turned off again without editing a file or reinstalling anything.
#
# What that file documented is still true and still the reason 4096 exists as a
# choice: in the Wave:3's Pro Audio card profile the capture node clocks the
# graph and the sink is a follower, and below 4096 the sink's ALSA buffer runs
# a ~112-frame fill floor that dips negative under load. pw-top reports ERR=0
# because the starvation is beneath PipeWire, in ALSA. Measured with a video
# playing: quantum 1024 and 2048 both left queued min 112 and audible
# stuttering; 4096 gave queued min 2400 and no underruns.
