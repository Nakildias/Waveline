# Waveline -- who drives the graph. Installed on every machine, always.
#
# One node in a PipeWire graph is the driver: its hardware interrupt is the
# clock every other node in its group is scheduled against. WirePlumber elects
# it by priority.driver, highest wins.
#
# WirePlumber's stock numbers rank capture above playback. Measured on a
# six-device machine, with nothing in this project having set any of them:
#
#   alsa_input   C922 webcam           2109   <- won, and clocked everything
#   alsa_input   OBSBOT Meet 4K        2109
#   alsa_input   Wave:3, Rocksmith     2100
#   alsa_input   built-in analog       2000
#   alsa_output  USB sinks             1109
#   alsa_output  built-in analog       1009
#   alsa_output  HDMI                   632
#
# So a 32 kHz webcam was the clock for a guitar adapter, a studio microphone
# and an HDMI capture card -- and unplugging the webcam re-clocked the entire
# graph onto whatever ranked next. Nobody chose that; it is what USB
# enumeration order happened to produce.
#
# The clock should be an output. An output's glitches are the ones you can
# hear -- a starved sink is a click in your headphones, a starved capture is a
# sample you can resample your way out of -- and every DAW and hardware mixer
# on the planet clocks off the monitor path for exactly that reason. Inputs
# should resample onto it.
#
# ------------------------------------------------- why this only lowers inputs
#
# The obvious implementation is to also raise every alsa_output. This file
# deliberately does not, for a reason that costs a working microphone:
#
#   Any WirePlumber rule matching the Wave:3's *sink* makes it reach the
#   hardware before the capture node does, and the Wave:3's ADC then produces
#   digital silence for the rest of the session. It is a device firmware
#   behaviour, it is not fixable from here, and it is why
#   51-waveline-wave3.conf carries "Do not add rules for the *output* node".
#
# A generic alsa_output rule is that rule. So the sinks are left untouched and
# only the inputs move -- which is sufficient: the lowest-ranked output in the
# table above is HDMI at 632, and 100 is below it. Every output outranks every
# input without a single sink property being written.
#
# It also means WirePlumber's output ladder is inherited rather than replaced,
# and that ladder is already the right shape: HDMI (632) below built-in analog
# (1009) below USB (1109). An HDMI sink is usually a monitor nobody listens
# through, and it is correctly the last output considered.
#
# --------------------------------------------------------- what is not claimed
#
# Two outputs of the same class tie, and PipeWire breaks the tie itself. This
# file does not control which one wins and does not pretend to.
#
# That tie is harmless, and rarer than it looks. Only *running* outputs are
# candidates at all (see the note at the bottom of this file), so in practice
# the tie is between outputs you are listening through simultaneously -- and
# 50-waveline-clock.conf pins the graph to 48 kHz, so every candidate is at the
# same rate and the failure this file exists to prevent cannot happen whichever
# way it falls.
#
# The mixer's diagnostics view names the node actually driving, so this is a
# glance rather than an investigation.
#
# ----------------------------------------------------------------- the fallback
#
# priority.driver is lowered, never zeroed, and node.driver is not touched.
#
# priority.session is not touched either, and that is the one to be sure of:
# WirePlumber picks the *default* input with priority.session, and ranks the
# device list every volume applet draws with the same key. The two start life
# equal (both 2100 on the Wave:3 here), so lowering one and not the other looks
# like an oversight and is not. Lowering both would demote every microphone
# below the built-in analog jack, and the user's chosen default mic would move
# on its own the first time this file was installed.
#
# A machine with no output at all -- a headless capture box, or one where the
# only sink failed to open -- must still have something eligible to drive the
# graph, and a graph with no eligible driver does not run at all. That is
# strictly worse than a badly chosen driver, so inputs stay eligible; they are
# simply last.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 100
      }
    }
  }
]

# NOT DONE HERE, and the reason is worth keeping.
#
# The first install of this file worked -- every capture node dropped to 100 and
# no input was driving -- and the clock landed on a Sony DualSense's headphone
# jack. A game controller looks like an obviously wrong clock: it sleeps, its
# battery dies, it gets unplugged. A rule ranking controller sinks below every
# real output was written, installed, and measured.
#
# It changed nothing. The DualSense still drove the graph at priority 600 while
# a Wave:3 sink sat at 1109 and the built-in analog output at 1009, because
# those two were `suspended` and the controller was `running`:
#
#   alsa_output.pci-...analog-stereo    state=suspended  prio=1009
#   alsa_output.usb-Elgato_...Wave_3    state=suspended  prio=1109
#   alsa_output.usb-Sony_...Controller  state=running    prio=600
#
# PipeWire elects the driver from nodes that are actually *running*. A suspended
# sink is not a candidate at any priority, so priority.driver only ever breaks
# ties between outputs that are simultaneously live.
#
# Which means the controller was never the bug. The graph clock follows the
# output you are listening through, and that is exactly the behaviour this file
# was written to produce: the clock should be the device whose glitches are
# audible as clicks. Plug your headphones into something else and the clock
# follows them; let the controller sleep and it stops being an output you are
# listening through at the same moment it stops being the clock.
#
# So: no sink is ranked here. The rule was reverted rather than kept as
# harmless, because a rule that ranks a user's *primary* monitor output last on
# a theory about what a device is for would eventually be wrong about somebody,
# and it writes to a sink, which is the operation 51-waveline-wave3.conf warns
# costs a working microphone.
#
# The lesson generalises: if the graph clock is ever somewhere surprising, look
# at which outputs are running before reaching for priorities. The mixer's
# diagnostics view names the driver, and that is the first place to look.
