<?xml version="1.0" encoding="UTF-8"?>
<!-- Waveline. Five level meters glowing out of a dark violet card. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="128" y1="16" x2="128" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a0a30"/>
      <stop offset="0.55" stop-color="#5a1660"/>
      <stop offset="1" stop-color="#a42a8e"/>
    </linearGradient>
    <linearGradient id="bar" x1="128" y1="54" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b0ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="128" cy="24" r="136" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 24) scale(1 0.75) translate(-128 -24)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.8"/>
    </filter>
  </defs>

  <!-- the card, the same rounded square as Movie Maker's -->
  <rect x="16" y="16" width="224" height="224" rx="52" ry="52" fill="url(#body)"/>
  <!-- the meters' glow, and the meters -->
  <g stroke="#e04dff" stroke-width="22" stroke-linecap="round" opacity=".55" filter="url(#blur)"><line x1="62" y1="100" x2="62" y2="168"/><line x1="95" y1="54" x2="95" y2="208"/><line x1="128" y1="92" x2="128" y2="182"/><line x1="161" y1="108" x2="161" y2="160"/><line x1="194" y1="72" x2="194" y2="180"/></g>
  <g stroke="url(#bar)" stroke-width="13" stroke-linecap="round"><line x1="62" y1="100" x2="62" y2="168"/><line x1="95" y1="54" x2="95" y2="208"/><line x1="128" y1="92" x2="128" y2="182"/><line x1="161" y1="108" x2="161" y2="160"/><line x1="194" y1="72" x2="194" y2="180"/></g>
  <!-- the sheen -->
  <rect x="16" y="16" width="224" height="224" rx="52" ry="52" fill="url(#sheen)"/>
</svg>
